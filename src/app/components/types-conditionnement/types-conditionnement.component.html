<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-6">Gestion des Types de Conditionnement</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Liste -->
    <div class="md:col-span-2 bg-white shadow rounded-lg p-4">
      <div *ngIf="loading" class="text-center py-4">Chargement...</div>
      
      <div *ngIf="!loading" class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nom</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Description</th>
              <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
            </tr>
          </thead>
          <tbody class="bg-white divide-y divide-gray-200">
            <tr *ngFor="let type of types" class="hover:bg-gray-50">
              <td class="px-6 py-4 whitespace-nowrap font-medium text-gray-900">{{ type.nom_type }}</td>
              <td class="px-6 py-4 text-gray-500">{{ type.description }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                <button (click)="selectType(type)" class="text-indigo-600 hover:text-indigo-900 mr-3">Modifier</button>
                <button (click)="deleteType(type.id_type)" class="text-red-600 hover:text-red-900">Supprimer</button>
              </td>
            </tr>
            <tr *ngIf="types.length === 0">
              <td colspan="3" class="px-6 py-4 text-center text-gray-500">Aucun type de conditionnement défini.</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Formulaire -->
    <div class="md:col-span-1 bg-white shadow rounded-lg p-6 h-fit sticky top-4">
      <h3 class="text-xl font-semibold mb-4">{{ selectedType.id_type ? 'Modifier' : 'Ajouter' }} un type</h3>
      
      <form (ngSubmit)="saveType()">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
          <input type="text" [(ngModel)]="selectedType.nom_type" name="nom_type" required 
                 class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea [(ngModel)]="selectedType.description" name="description" rows="3"
                    class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
        </div>

        <div class="flex justify-end space-x-3">
          <button type="button" *ngIf="isEditing" (click)="resetForm()" 
                  class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">Annuler</button>
          <button type="submit" [disabled]="saving || !selectedType.nom_type"
                  class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50">
            {{ saving ? 'Enregistrement...' : 'Enregistrer' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
