<div class="container mx-auto p-4">
  <h2 class="text-2xl font-bold mb-6">Gestion des Clients</h2>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <!-- Liste des clients -->
    <div class="md:col-span-1 bg-white shadow rounded-lg p-4 h-fit">
      <h3 class="text-lg font-semibold mb-4">Liste des clients</h3>
      <div *ngIf="loading" class="text-center text-gray-500 py-4">Chargement...</div>
      
      <ul class="space-y-2" *ngIf="!loading">
        <li *ngFor="let client of clients" 
            (click)="selectClient(client)"
            class="flex justify-between items-center p-3 rounded cursor-pointer transition-colors border border-gray-100"
            [class.bg-blue-50]="selectedClient.id_client === client.id_client"
            [class.border-blue-200]="selectedClient.id_client === client.id_client"
            [class.bg-gray-50]="selectedClient.id_client !== client.id_client"
            [class.hover:bg-gray-100]="selectedClient.id_client !== client.id_client">
          <div class="flex flex-col">
            <span class="font-medium">{{ client.nom }} {{ client.prenom }}</span>
            <span class="text-sm text-gray-500">{{ client.email }}</span>
          </div>
          <button class="text-red-500 hover:text-red-700 p-2 rounded hover:bg-red-50 transition-colors" (click)="deleteClient(client.id_client); $event.stopPropagation()">
            🗑️
          </button>
        </li>
      </ul>
      <div *ngIf="!loading && clients.length === 0" class="text-center text-gray-500 py-4">
        Aucun client trouvé.
      </div>
    </div>

    <!-- Formulaire d'édition/ajout -->
    <div class="md:col-span-2 bg-white shadow rounded-lg p-6 h-fit">
      <h3 class="text-xl font-semibold mb-6">{{ isEditing ? 'Modifier le client' : 'Ajouter un nouveau client' }}</h3>
      
      <form (ngSubmit)="saveClient()">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
          <div>
            <label for="nom" class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
            <input type="text" id="nom" [(ngModel)]="selectedClient.nom" name="nom" required placeholder="Ex: Dupont" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>
          <div>
            <label for="prenom" class="block text-sm font-medium text-gray-700 mb-1">Prénom</label>
            <input type="text" id="prenom" [(ngModel)]="selectedClient.prenom" name="prenom" placeholder="Ex: Jean" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
          </div>
        </div>

        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email *</label>
          <input type="email" id="email" [(ngModel)]="selectedClient.email" name="email" required placeholder="Ex: jean.dupont@email.com" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <div class="mb-4">
          <label for="telephone" class="block text-sm font-medium text-gray-700 mb-1">Téléphone</label>
          <input type="tel" id="telephone" [(ngModel)]="selectedClient.telephone" name="telephone" placeholder="Ex: 06 12 34 56 78" class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all">
        </div>

        <div class="mb-6">
          <label for="adresse" class="block text-sm font-medium text-gray-700 mb-1">Adresse par défaut</label>
          <textarea id="adresse" [(ngModel)]="selectedClient.adresse_defaut" name="adresse" rows="3" placeholder="Adresse complète..." class="w-full p-2 border border-gray-300 rounded focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"></textarea>
        </div>

        <div class="flex justify-end space-x-3">
          <button type="button" class="px-4 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 transition-colors" (click)="resetForm()" *ngIf="isEditing">Annuler</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors" [disabled]="!selectedClient.nom || !selectedClient.email">
            {{ isEditing ? 'Mettre à jour' : 'Ajouter' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
